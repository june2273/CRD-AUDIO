<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRD Audio Sidecar</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
  button { width: 100%; font-size: 22px; padding: 18px; border: 0; border-radius: 14px; background: #1a73e8; color: #fff; }
  button.on { background: #5f6368; }
  #state { display: block; margin-top: 12px; color: #666; text-align: center; }
  #stats { font: 12px monospace; color: #999; white-space: pre; margin-top: 24px; }
</style>
</head>
<body>
<h2>CRD Audio Sidecar</h2>
<button id="btn">연결</button><span id="state">끊김</span>
<audio id="audio" autoplay playsinline></audio>
<div id="stats"></div>
<script>
const btn = document.getElementById('btn');
const stateEl = document.getElementById('state');
const audio = document.getElementById('audio');
let pc = null, stream = null, timer = null, retryTimer = null;

// aiortc는 opus fmtp에 stereo=1을 넣지 않아서 Chrome이 모노로 다운믹스한다 → 직접 추가
function stereo(sdp) {
  const m = sdp.match(/a=rtpmap:(\d+) opus\/48000\/2/i);
  if (!m) return sdp;
  const pt = m[1];
  const fmtp = new RegExp(`a=fmtp:${pt} (.*)`);
  return fmtp.test(sdp)
    ? sdp.replace(fmtp, (_, p) => `a=fmtp:${pt} ${p};stereo=1;sprop-stereo=1`)
    : sdp.replace(m[0], `${m[0]}\r\na=fmtp:${pt} stereo=1;sprop-stereo=1`);
}

// iOS/iPadOS(WebKit)는 클릭 직후에만 재생을 허용하고, await(fetch 등)를 지나면 허용이 만료된다.
// → 클릭 시점에 빈 스트림으로 play()를 먼저 걸어두고, 트랙은 도착하면 그 스트림에 넣는다.
// 재연결 때도 같은 스트림·엘리먼트를 계속 쓰므로 다시 클릭할 필요가 없다 (백그라운드에서도 복구).
function start() {
  stream = new MediaStream();
  audio.srcObject = stream;
  audio.play().catch(e => { stateEl.textContent = '재생 차단: ' + e.name; });
  timer = setInterval(showStats, 1000);
  connect();
}

async function connect() {
  const p = pc = new RTCPeerConnection();
  p.addTransceiver('audio', { direction: 'recvonly' });
  p.ontrack = e => {
    stream.getTracks().forEach(t => stream.removeTrack(t));
    stream.addTrack(e.track);
  };
  p.onconnectionstatechange = () => {
    if (p !== pc) return;
    if (p.connectionState === 'failed') retry('연결 끊김');
    else stateEl.textContent = { connected: '연결됨', connecting: '연결 중' }[p.connectionState] ?? p.connectionState;
  };
  stateEl.textContent = '연결 중';
  try {
    const offer = await p.createOffer();
    offer.sdp = stereo(offer.sdp);
    await p.setLocalDescription(offer);
    // aiortc는 ICE 후보를 trickle하지 않으므로 수집 완료 후 한 번에 보낸다
    await new Promise(r => {
      if (p.iceGatheringState === 'complete') return r();
      p.addEventListener('icegatheringstatechange', () => p.iceGatheringState === 'complete' && r());
    });
    const res = await fetch('/offer', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sdp: p.localDescription.sdp, type: p.localDescription.type }),
    });
    const answer = await res.json();
    answer.sdp = stereo(answer.sdp);
    if (p === pc) await p.setRemoteDescription(answer);
  } catch (e) {
    if (p === pc) retry(e.message);
  }
}

function retry(err) {
  pc.close(); pc = null;
  stateEl.textContent = err + ' — 3초 후 재연결';
  retryTimer = setTimeout(connect, 3000);
}

async function showStats() {
  if (!pc) return;
  (await pc.getStats()).forEach(s => {
    if (s.type === 'inbound-rtp' && s.kind === 'audio') {
      const jb = s.jitterBufferEmittedCount ? (s.jitterBufferDelay / s.jitterBufferEmittedCount * 1000).toFixed(0) : '-';
      document.getElementById('stats').textContent =
        `packets: ${s.packetsReceived}  lost: ${s.packetsLost}\njitter buffer: ${jb} ms\nlevel: ${(s.audioLevel ?? 0).toFixed(3)}\naudio: ${audio.paused ? 'paused' : 'playing'}`;
    }
  });
}

function stop() {
  clearInterval(timer);
  clearTimeout(retryTimer);
  pc?.close(); pc = null;
  audio.srcObject = stream = null;
  stateEl.textContent = '끊김';
}

btn.onclick = () => {
  const on = !stream;
  on ? start() : stop();
  btn.textContent = on ? '끊기' : '연결';
  btn.classList.toggle('on', on);
};
</script>
</body>
</html>
